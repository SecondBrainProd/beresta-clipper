<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px -apple-system, system-ui, sans-serif;
        padding: 12px;
        min-width: 320px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 4px 6px;
      }
      p {
        color: #555;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <label for="token">Токен</label>
    <input id="token" type="text" autocomplete="off" spellcheck="false" />
    <label for="port">Порт</label>
    <input id="port" type="number" min="1" max="65535" placeholder="21120" />
    <p>
      Оба значения показывает Beresta: Параметры → «Вырезки». Сохраняется само.
    </p>
    <script src="options.js"></script>
  </body>
</html>
